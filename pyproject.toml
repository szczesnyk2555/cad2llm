[project]
name = "cad2llm"
version = "0.1.0"
description = "Extract measurements from STEP / DXF / PDF files and ask an OpenAI model to describe the part"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.4",
    "ezdxf>=1.3",
    "pymupdf>=1.24",
    "matplotlib>=3.8",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cad2llm"]
